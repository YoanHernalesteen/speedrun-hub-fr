# PostgreSQL local pour le développement de Speedrun Hub.
# Port hôte 5433 pour ne pas entrer en conflit avec d'autres instances Postgres.
# Démarrer : docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: speedrun_hub_fr_postgres
    environment:
      POSTGRES_USER: speedrun_hub_fr
      POSTGRES_PASSWORD: speedrun_hub_fr
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedrun_hub_fr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
