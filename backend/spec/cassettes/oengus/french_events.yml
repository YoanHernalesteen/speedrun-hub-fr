      string: "{\"announceAcceptedSubmissions\":false,\"bluesky\":\"@drakelelionblanc.bsky.social\",\"canEditSubmissions\":true,\"country\":null,\"defaultSetupTime\":\"PT15M\",\"description\":\"#
        \U0001F3AE Présentation\\n**Celet's Speed** est une émission régulière de
        speedrun animée sur la chaîne de DrakeLeLionBlanc.\\n\\nL'objectif de l'émission
        est simple :\\n* tester votre run en conditions réelles et sans pression ;\\n*
        vous permettre d'avoir une belle VOD de votre run ;\\n* faire vivre la communauté
        speedrun tout au long de l'année.\\n\\nPour fêter les **3 ans de Celet's Speed**,
        l'émission passe exceptionnellement au format **marathon** pendant plusieurs
        jours !\\nAucune restriction particulière sur vos propositions : speedrun,
        superplay, showcase, randomizer ou tout autre concept... **faites-vous (et
        faites-nous) plaisir !**\\nCette édition accueillera également un **bloc anglophone
        de 4 heures**, afin de permettre aux runners et commentateurs anglophones
        de participer au marathon.\\n\\n# \U0001F5D3️ Candidatures & Planning\\n**Candidatures
        ouvertes :** du 7 septembre 2026 au 8 novembre 2026 à 23h59.\\n**Annonce du
        planning :** avant le 29 novembre 2026.\\n\\nTout type de run est accepté
        : speedrun, superplay, showcase, randomizer, challenge, etc.\\n\\n**La seule
        limite : votre imagination !**\\n\\nLors de votre candidature, pensez à indiquer
        vos disponibilités afin de faciliter la construction du planning.\\n\\n# \U0001F30D
        Bloc anglophone\\nUn **bloc de 4 heures en anglais** sera intégré au marathon
        (si possible !).\\n\\nCe bloc est destiné aux runners et commentateurs anglophones
        souhaitant participer à l'événement.\\nIl représente également une première
        expérience pour ouvrir Celet's Speed à une audience plus large et internationale,
        tout en intégrant une partie importante de mon aventure dans le speedrun :
        mon propre événement.\\n\\nC'est donc l'occasion de faire découvrir Celet's
        Speed à de nouvelles personnes, mais aussi de partager avec la communauté
        anglophone une émission qui occupe une place importante dans mon parcours
        de speedrunner.\\nLes runs présentés durant ce bloc devront être **présentés
        et commentés en anglais**.\\n\\nLes mêmes principes que pour le reste du marathon
        s'appliquent :\\n* tous les types de runs sont les bienvenus ;\\n* aucune
        restriction particulière sur les jeux ;\\n* indiquez un estimate RTA réaliste
        ;\\n* renseignez vos disponibilités lors de votre candidature.\\n\\nLe bloc
        anglophone durera environ **4 heures** et sera intégré au planning général
        du marathon.\\n\\n# ⏰ Disponibilités & Organisation du Marathon\\nLe marathon
        se déroulera du **10/12 au 13/12**.\\nLe bloc anglophone de 4 heures sera
        intégré au planning du marathon.\\nAfin de permettre au plus grand nombre
        de participer et de faciliter l'organisation, le planning pourra également
        s'étendre sur **une soirée supplémentaire** avant le marathon.\\nCette soirée
        prendra la forme d'un **Celet's Speed classique**, afin de lancer les festivités
        plus tôt et de potentiellement accueillir davantage de runs.\\n\\n⚠️ **Aucun
        horaire ne sera prévu entre 2h et 9h du matin (CEST).**\\nLes disponibilités
        indiquées lors de votre candidature seront prises en compte autant que possible,
        mais elles ne garantissent pas un horaire précis.\\n\\n# \U0001F4A1 Informations
        complémentaires\\n\\n## \U0001F50E Review\\nUne équipe de review sera constituée
        pour l'occasion afin d'étudier les propositions et de construire un planning
        cohérent.\\nSi vous souhaitez participer à la review, surveillez mon **Bluesky**
        et mon **Discord** pour les informations concernant le recrutement.\\nLa team
        review respectera la charte de mes événements, disponible ici :\\nhttps://docs.google.com/document/d/12PWXWDM4P6imcQAhodCjkqJa2l42vMs1LhjBjK8zAus/edit?usp=sharing\\n\\n##
        ⏱️ Estimates\\nAssurez-vous d'indiquer vos estimates en **RTA (Real Time Attack
        / temps réel)**.\\n⚠️ **Ne prenez pas votre PB (Personal Best) comme estimate.**\\nVotre
        estimate doit correspondre à la durée que vous pensez raisonnablement nécessaire
        pour terminer votre run dans les conditions du marathon.\\nPrévoyez une marge
        d'erreur généreuse afin d'éviter tout stress inutile pendant votre passage.\\n\\n##
        \U0001F6E0️ Setup\\nUn guide de setup sera fourni lors de l'annonce du planning.\\nUn
        **check technique** sera également organisé afin de s'assurer que tout fonctionnera
        correctement le jour du marathon.\\n\\n✅ Assurez-vous d'avoir une connexion
        suffisamment stable pour streamer en **720p minimum**.\\n\\n# \U0001F4E1 Diffusion
        & Réseaux sociaux\\nLe marathon sera diffusé sur :\\n**Twitch :** twitch.tv/drakelelionblanc\\n**Bluesky
        :** drakelelionblanc.bsky.social\\n\\nL'événement se déroulera sur mon Discord
        :\\nhttps://discord.gg/NqYr4FHvsz\\n\\nIl s'agit de mon Discord personnel
        : vous êtes évidemment libres de le quitter après le marathon.\\n\\nPensez
        à **accepter les règles du serveur** afin d'avoir accès aux différents salons.\\n\\nToutes
        les informations importantes concernant le marathon seront communiquées dans
        le salon **#cst-marathon-speedrun**.\\n\\n\\n*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*\\n\\n#
        \U0001F3AE About\\n**Celet's Speed** is a regular speedrunning show hosted
        on DrakeLeLionBlanc's Twitch channel.\\n\\nThe goal of the show is simple:\\n*
        test your run in real conditions, without pressure;\\n* give you a nice VOD
        of your run;\\n* keep the speedrunning community active throughout the year.\\n\\nTo
        celebrate **Celet's Speed's 3rd anniversary**, the show is making the jump
        to a **multi-day online marathon**!\\nThere are no specific restrictions on
        what you can submit: speedruns, superplays, showcases, randomizers, or anything
        else... **have fun and make us have fun!**\\nThis edition will also feature
        a dedicated **4-hour English-language block**, giving English-speaking runners
        and commentators the opportunity to take part in the marathon.\\n\\n# \U0001F5D3️
        Submissions & Schedule\\n**Submissions open:** September 7, 2026 to November
        8, 2026 at 11:59 PM.\\n**Schedule announcement:** by November 29, 2026.\\n\\nAll
        types of runs are welcome: speedruns, superplays, showcases, randomizers,
        challenges, etc.\\n**The only limit is your imagination!**\\nWhen submitting
        your run, please make sure to provide your availability to help with the scheduling
        process.\\n\\n# \U0001F30D English Block\\nA dedicated **4-hour English-language
        block** will be part of the marathon.\\nThis block is intended for English-speaking
        runners and commentators who would like to participate in the event.\\nRuns
        featured during this block should be **presented and commentated in English**.\\n\\nThe
        English Block will last approximately **4 hours** and will be scheduled as
        part of the main marathon.\\nDon't speak French? **No problem, you're welcome
        to join us anyway!**\\n\\n# ⏰ Availability & Marathon Schedule\\nThe marathon
        will take place from **December 10 to December 13**.\\nThe 4-hour English
        Block will be integrated into the main marathon schedule.\\nDepending on the
        number of submissions, the schedule may also be extended with **an additional
        evening** before the main marathon.\\nThis additional evening will follow
        the usual **Celet's Speed format**, allowing us to kick off the festivities
        earlier and potentially fit in more runs.\\n\\n⚠️ **No runs will be scheduled
        between 2 AM and 9 AM (CEST).**\\n\\nThe availability you provide in your
        submission will be taken into account as much as possible, but it does not
        guarantee a specific time slot.\\n\\n# \U0001F4A1 Additional Information\\n##
        \U0001F50E Review\\nThe review team will follow the event charter, available
        here (available in french only for now) :\\nhttps://docs.google.com/document/d/12PWXWDM4P6imcQAhodCjkqJa2l42vMs1LhjBjK8zAus/edit?usp=sharing\\n\\n##
        ⏱️ Estimates\\nPlease provide your estimate in **RTA (Real Time Attack)**.\\n⚠️
        **Do not use your PB (Personal Best) as your estimate.**\\nYour estimate should
        reflect the amount of time you reasonably expect to need to complete your
        run under marathon conditions.\\nPlease give yourself a generous buffer to
        avoid unnecessary stress during your run.\\n\\n## \U0001F6E0️ Setup\\nA setup
        guide will be provided when the schedule is announced.\\nA **technical check**
        will also be organized to make sure everything works properly before the marathon.\\n\\n✅
        Please make sure you have a stable enough internet connection to stream at
        **720p minimum**.\\n\\n# \U0001F4E1 Broadcast & Social Media\\nThe marathon
        will be streamed on:\\n**Twitch:** twitch.tv/drakelelionblanc\\n**Bluesky:**
        drakelelionblanc.bsky.social\\n\\nThe event will take place on my Discord
        server:\\nhttps://discord.gg/NqYr4FHvsz\\nThis is my personal Discord server,
        so feel free to leave it once the marathon is over. It's also in french mainly
        sodon't be surprised and don't hesitate to ask for help if lost !\\n\\nPlease
        **accept the server rules** to gain access to the different channels. (in
