      string: "{\"announceAcceptedSubmissions\":true,\"bluesky\":\"@nitro-speedrun.com\",\"canEditSubmissions\":false,\"country\":null,\"defaultSetupTime\":\"PT15M\",\"description\":\"#
        ---FRANCAIS--- # \\n\\n# Bienvenue au Nitro Days for SPDA 2026 organisé par
        Nitro Speedrun ! # \\n\\n# ⚠️ A LIRE AVANT DE SUBMIT ⚠️ # \\n\\n# ⚡ Les bases
        : # \\n\\n- Le Nitro Days for SPDA 2026 est un marathon caritatif en ligne
        bénéficiant la SPDA (https://www.spda.fr/), Un refuge animalier indépendant
        et Association reconnue d'Intérêt Général depuis Mars 2025.\\n- Pendant le
        Nitro Days, nous présenteront du Speedrun mais aussi les différents formats
        de Nitro Speedrun. Pour ce faire, nous cherchons des grosses courses, des
        randomizers/archipelagos, des runs longues, du blindfolded, des showcases,
        tout ce qu'il vous passe par la tête !\\n\\n# \U0001F4C6 Les dates : # \\n\\n-
        Inscriptions ouvertes du **Vendredi 4 Septembre à 20:00 au Dimanche 27 Septembre
        à 23:59**.\\n- Communication du planning le **Vendredi 30 Octobre à 19:00**.\\n-
        Live du Vendredi **27 Novembre à 18:00 au Dimanche 29 Novembre à 22:00**.\\n-
        Le live comprendra des coupures durant les nuits.\\n\\n# \U0001F4C3 Informations
        complémentaires : # \\n\\n**Maintenant nous dissocions nos marathons Online
        et IRL, ce qui veut dire qu'un jeu séléctionné pour un Nitro Days ne sera
        pas pénalisé pour un Nitro Speedrun Festival et vice versa**.\\n\\n# Submits
        : # \\n\\n- Limité à 5 jeux et/ou catégories pour chaque runner.euse. (Pour
        submit plusieurs catégorie du même jeu, vous n'avez qu'à rentrer le jeu une
        2nd fois.)\\n- Nous aurons des layouts pour 4 runners simultanés, mais nous
        pouvons nous arranger pour plus dépendant du format !\\n- Précisez dans vos
        submits les incentives, bidwars, prédictions et à chaque fois le temps à ajouter
        à votre estimate.\\n- Ne vous limitez pas en terme d'animation ou de durée
        des runs, rien n'est impossible chez Nitro !\\n- Attention à bien mettre des
        estimates en temps RTA (en temps réel) !!!\\n- Signalez nous toutes alertes
        de contenu dans tes runs (violence excessive/gore, épilepsie, etc...)\\n-
        Les jeux avec du contenu sexuel explicite, de la discrimination, et les jeux
        de la franchise Harry Potter sont interdits et les candidatures seront ignorées.\\n\\n#
        Commentaires : # \\n\\n- Vous pouvez choisir vous-même votre commentateur.ice,
        si vous n'avez personnes nous pourrons en trouver.\\n- Votre commentateur.ice
        doit avoir accès au discord, il/elle devra donc le rejoindre en amont.\\n-
        Vous avez évidemment la possibilité de vous commenter vous-même si vous le
        souhaitez.\\n\\n# Matériel/Setup : # \\n\\n- Vous devez avoir un internet
        stable, car la run sera streamée depuis votre setup.\\n- Le jour J, tu seras
        accompagné par l'équipe tech pour finaliser le setup.\\n\\nL'équipe Nitro
        Speedrun te remercie d'avoir pris le temps de lire ❤️\\n\\n\\n# ---ENGLISH---
        #\\n\\n# Welcome to Nitro Days for SPDA 2026 organized by Nitro Speedrun!
        # \\n\\n# ⚠️ PLEASE READ BEFORE SUBMITTING ⚠️ # \\n\\n# ⚡ The Basics: # \\n\\n-
        Nitro Days for SPDA 2026 is an online charity marathon benefitting SPDA (https://www.spda.fr/),
        An independant animal shelter.\\n- During the Nitro Days, we will be showcasing
        speedrun as well as different Nitro Speedrun formats, to do so, we are looking
        for a big races, randomizers/archipelagos, longer runs, blindfolded, showcases,
        you name it!\\n\\n# \U0001F4C6 Important Dates: # \\n\\n- Submissions open
        from **Friday, September 4 at 8:00 PM to Sunday, September 27 at 11:59 PM**.\\n-
        Schedule announcement on **Friday, October 30 at 7:00 PM**.\\n- Online event
        from **Friday, November 27 at 6:00 PM to Sunday, November 29 at 10:00 PM**.\\n-
        Stream will be cut during nights\\n\\n# \U0001F4C3 Additional Information:
        # \\n\\n**We are now separating our online and in-real-life marathons, which
        means that a game selected for a Nitro Days event will not be penalised for
        a Nitro Speedrun Festival, and vice versa.**\\n\\n# Submissions: # \\n\\n-
        Limited to 5 games and/or categories per entrant. (To submit entries for multiple
        categories of the same game, simply enter the game a second time.)\\n- Layouts
        may be designed for up to 4 runners for a race, but we could accomodate more.\\n-
        Please include in your submission all incentives, bidwars, and predictions,
        along with the extra time to be added to your estimate.\\n- Don’t hold back
        in terms of showmanship or run length—nothing is impossible at Nitro!\\n-
        Important: Make sure to use RTA (real-time) estimates!\\n- Please specify
        trigger warnings for your run (excessive violence/gore, epilepsy, etc...)\\n-
        Games with overly sexual content, discrimination, and games from the Harry
        Potter franchise are banned from the event and submits will be ignored.\\n\\n#
        Commentary: # \\n\\n- You can choose your own commentator if you have someone
        in mind—otherwise, we’ll assign one to you.\\n- Your commentator must speak
        in french but of course you can interact and talk a bit in english too.\\n-
        You can recommand someone for the english restream too!\\n- Your commentator
        must have access to Discord and should join the server ahead of time.\\n\\n#
        Equipment / Setup: # \\n\\n- You are required to have stable internet, as
        the run will be streamed from your setup.\\n- On the big day, the tech team
        will assist you in finalizing your setup.\\n\\nThe Nitro Speedrun team thanks
        you for taking the time to read this ❤️\",\"discord\":\"tSVHSKsybG\",\"discordGuildId\":\"1012050852275560599\",\"discordGuildName\":\"Nitro
        Speedrun\",\"discordPrivacy\":false,\"discordRequired\":true,\"donationCurrency\":null,\"donationsOpen\":true,\"donationsTotal\":null,\"emulatorAuthorized\":true,\"endDate\":\"2026-11-29T21:30:00Z\",\"hasDonations\":false,\"hasIncentives\":false,\"hasMultiplayer\":true,\"hasSubmitted\":false,\"id\":\"NDS3\",\"isPrivate\":false,\"language\":\"fr\",\"location\":null,\"mastodon\":null,\"maxCategoriesPerGame\":1,\"maxGamesPerRunner\":5,\"maxNumberOfScreens\":4,\"name\":\"Nitro
        Days for SPDA 2026\",\"onsite\":false,\"payee\":null,\"questions\":[{\"description\":\"\",\"fieldType\":\"SELECT\",\"id\":8218,\"label\":\"
        Voulez vous être interviewé après votre run? / Do you wish to be interviewed
        after your run?\",\"options\":[\"Oui / Yes\",\"Non / No\"],\"position\":0,\"questionType\":\"SUBMISSION\",\"required\":true},{\"description\":\"\",\"fieldType\":\"TEXT\",\"id\":8216,\"label\":\"Quels
        sont vos pronoms d'usage? / What are your preferred pronouns?\",\"options\":[],\"position\":1,\"questionType\":\"SUBMISSION\",\"required\":false},{\"description\":\"\",\"fieldType\":\"TEXTAREA\",\"id\":8217,\"label\":\"Pouvez-vous
        décrire vos potentiels incentives? / Please describe your possible incentives
        ?\",\"options\":[],\"position\":2,\"questionType\":\"SUBMISSION\",\"required\":false},{\"description\":\"\",\"fieldType\":\"TEXTAREA\",\"id\":8219,\"label\":\"Pouvez-vous
        noter les trigger warnings de vos runs ? / Could you please note the trigger
        warnings ?\",\"options\":[],\"position\":3,\"questionType\":\"SUBMISSION\",\"required\":false}],\"scheduleDone\":true,\"selectionDone\":true,\"startDate\":\"2026-11-27T17:00:00Z\",\"submissionsEndDate\":\"2026-09-27T21:59:00Z\",\"submissionsStartDate\":\"2026-09-04T18:00:00Z\",\"submitsOpen\":false,\"supportedCharity\":null,\"teams\":null,\"twitch\":\"nitro_speedrun\",\"twitter\":\"Nitro_Speedrun\",\"unlimitedCategories\":false,\"unlimitedGames\":false,\"userInfoHidden\":null,\"videoRequired\":true,\"webhook\":null,\"youtube\":\"https://www.youtube.com/channel/UCW8jjfq3NrIBanEIWF2-ALw\"}"
